{% extends 'base.html' %}
{% block title %}{% if item %}Редактировать подарок{% else %}Добавить подарок{% endif %} — TugoBirthdays{% endblock %}
{% block content %}
<div class="card" style="max-width: 500px; margin: 2rem auto;">
    <h2>{% if item %}Редактировать подарок{% else %}Добавить подарок{% endif %}</h2>
    <form method="post" style="margin-top: 1rem;">
        {% csrf_token %}
        <div class="form-group">
            <label>Название *</label>
            <input type="text" name="title" value="{{ item.title|default:'' }}" required>
        </div>
        <div class="form-group">
            <label>Описание</label>
            <textarea name="description" rows="3">{{ item.description|default:'' }}</textarea>
        </div>
        <div class="form-group">
            <label>Ссылка</label>
            <input type="url" name="link" value="{{ item.link|default:'' }}">
        </div>
        <div class="form-group">
            <label>Цена (руб.)</label>
            <input type="number" name="price" step="0.01" value="{{ item.price|default:'' }}">
        </div>
        <button type="submit" class="btn btn-primary">Сохранить</button>
    </form>
</div>
{% endblock %}
